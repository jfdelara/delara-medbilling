name: Publish site to gh-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import site bundle (if .deploy/bundle.txt present)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .deploy/bundle.txt ]; then
            read -r URL SHA < .deploy/bundle.txt
            curl -sSfL -o /tmp/bundle.tgz "$URL"
            echo "$SHA  /tmp/bundle.tgz" | sha256sum -c -
            rm -rf site && mkdir site
            tar -xzf /tmp/bundle.tgz -C site
            touch site/.nojekyll
            git rm -q .deploy/bundle.txt
            git add -A site
            git commit -m "Import site bundle $SHA"
            git push origin HEAD:main
          fi
          test -f site/index.html
      - name: Push site/ to pages-src and gh-pages branches
        run: |
          set -euo pipefail
          touch site/.nojekyll
          git add -A site && (git diff --cached --quiet || (git commit -m "Add .nojekyll" && git push origin HEAD:main))
          git subtree split --prefix site -b pages-tmp
          git push -f origin pages-tmp:refs/heads/pages-src
          # GitHub Pages gets the public "Get the app" page + legal pages only (Fee Desk is app-only; site/ stays private source).
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            python3 scripts/landing-bundle.py --out /tmp/landing
            git worktree add --detach /tmp/ghp
            ( cd /tmp/ghp && git checkout --orphan gh-pages-new && git rm -rfq . && cp -a /tmp/landing/. . && git add -A && git commit -qm "Get the app page" && git push -f origin HEAD:refs/heads/gh-pages )
          fi
